# Mises à jour automatiques des dépendances (une PR groupée par écosystème et par semaine).
#
# Ce qui est volontairement ignoré (à faire à la main, en connaissance de cause) :
#  - TypeScript 7 : @angular/build exige TypeScript >=6.0 <6.1, `npm ci` échoue sinon.
#  - Java et nginx : les tags Docker sont flottants (les correctifs arrivent seuls). Dependabot ne propose donc
#    que des changements de version majeure, souvent hors LTS (Java 26, nginx mainline 1.31).
#    Java : prochaine LTS = 29 (septembre 2027). nginx : on reste sur la branche stable (versions paires).
#  - Node : les versions impaires ne sont pas LTS ; on monte à la main sur une version paire.
version: 2
updates:
  - package-ecosystem: maven
    directory: /collector
    schedule: { interval: weekly }
    groups:
      maven-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /dashboard
    schedule: { interval: weekly }
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker
    directory: /collector
    schedule: { interval: weekly }
    ignore:
      - dependency-name: maven
      - dependency-name: eclipse-temurin

  - package-ecosystem: docker
    directory: /dashboard
    schedule: { interval: weekly }
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
      - dependency-name: nginx
        update-types: ['version-update:semver-minor', 'version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
