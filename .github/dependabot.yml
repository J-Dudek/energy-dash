# Mises à jour automatiques des dépendances (une PR groupée par écosystème et par semaine).
version: 2
updates:
  - package-ecosystem: maven
    directory: /collector
    schedule: { interval: weekly }
    groups:
      maven-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /dashboard
    schedule: { interval: weekly }
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /collector
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /dashboard
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
