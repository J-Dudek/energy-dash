services:
  collector:
    build: ./collector
    image: conso-collector:latest
    container_name: conso-collector
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Paris
    volumes:
      - collector-data:/app/data   # jeton Netatmo (il tourne à chaque collecte)
    # Durcissement : aucune capability Linux, système de fichiers en lecture seule (seuls /tmp et le volume
    # ci-dessus sont inscriptibles). On pourra ajouter `security_opt: [no-new-privileges:true]` si l'hôte Docker
    # le supporte : il empêche le démarrage des conteneurs sur certaines installations.
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 200
    mem_limit: 384m

  dashboard:
    build: ./dashboard
    image: conso-dashboard:latest
    container_name: conso-dashboard
    restart: unless-stopped
    environment:
      APPWRITE_ENDPOINT: ${CONSO_APPWRITE_PUBLIC_ENDPOINT}
      APPWRITE_PROJECT_ID: ${CONSO_APPWRITE_PROJECT_ID}
      APPWRITE_DATABASE_ID: ${CONSO_APPWRITE_DATABASE_ID:-conso}
      APPWRITE_BUCKET_ID: ${CONSO_APPWRITE_BUCKET_ID:-invoices}
      SESSION_IDLE_MINUTES: ${CONSO_SESSION_IDLE_MINUTES:-30}
      SESSION_MAX_HOURS: ${CONSO_SESSION_MAX_HOURS:-12}
    # Écoute en local uniquement : l'accès passe par le reverse proxy HTTPS du NAS (voir README).
    # Pour tester depuis le réseau local : CONSO_DASHBOARD_BIND=0.0.0.0
    ports:
      - "${CONSO_DASHBOARD_BIND:-127.0.0.1}:8095:80"
    # (pas de no-new-privileges ici : l'entrypoint de l'image nginx ne démarre pas avec sur certains hôtes Docker)
    cap_drop:
      - ALL
    cap_add: # le strict nécessaire à nginx : ouvrir le port 80 puis passer à l'utilisateur "nginx"
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/cache/nginx
    pids_limit: 100
    mem_limit: 64m

volumes:
  collector-data:
