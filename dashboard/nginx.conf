server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    # En-têtes de sécurité générés au démarrage (voir docker-entrypoint.d/40-config-json.sh) : la CSP
    # dépend de l'endpoint Appwrite. Un add_header dans un location écrase ceux du server : on l'inclut partout.
    include /tmp/conso/security-headers.conf;

    # Site statique : pas d'autre méthode que lecture
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Pas de fichiers cachés (.git, .env...) même s'il y en avait un dans l'image
    location ~ /\. {
        return 404;
    }

    location = /config.json {
        alias /tmp/conso/config.json;
        include /tmp/conso/security-headers.conf;
        add_header Cache-Control "no-store";
    }

    location / {
        include /tmp/conso/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|ico|svg|png)$ {
        include /tmp/conso/security-headers.conf;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
