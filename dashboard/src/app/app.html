@if (update.available()) {
  <div class="update-bar" role="status">
    <span>Une nouvelle version est disponible.</span>
    <button type="button" class="primary sm" (click)="update.reload()">Recharger</button>
  </div>
}
@if (!ready()) {
  <main class="center"><p class="muted">Chargement…</p></main>
} @else if (!aw.user()) {
  <main class="center">
    <form class="login card" (ngSubmit)="login()">
      <div class="brand">
        <img src="icons/logo.png" alt="" width="86" height="128" />
        <h1>Conso maison</h1>
        <p class="muted">Eau, gaz et électricité</p>
      </div>
      <label
        >E-mail
        <input type="email" name="email" [(ngModel)]="email" autocomplete="username" required />
      </label>
      <label
        >Mot de passe
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          autocomplete="current-password"
          required
        />
      </label>
      @if (aw.notice(); as notice) {
        <p class="muted small" role="status">{{ notice }}</p>
      }
      @if (error()) {
        <p class="error" role="alert">{{ error() }}</p>
      }
      <button type="submit" class="primary" [disabled]="loading()">
        {{ loading() ? 'Connexion…' : 'Se connecter' }}
      </button>
      @if (passkeySupported) {
        <button type="button" class="ghost" (click)="loginWithPasskey()" [disabled]="loading()">
          Se connecter avec une passkey
        </button>
      }
    </form>
  </main>
} @else {
  <router-outlet />
}
